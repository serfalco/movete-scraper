# Prueba única: ¿Teatrina responde desde el runner de GitHub? Borrar después.
name: Prueba Teatrina
on:
  push:
    branches: [prueba/teatrina]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir páginas públicas
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) Chrome/120.0'
          for u in https://teatrina.com/robots.txt \
                   https://teatrina.com/sitemap.xml \
                   https://teatrina.com/cartelera/barrio/la-plata \
                   https://teatrina.com/salas/teatro-rene-favaloro; do
            code=$(curl -sS -m 30 -A "$UA" -o /tmp/r -w '%{http_code}' "$u" || echo ERR)
            echo "RESULTADO $code $u :: $(head -c 150 /tmp/r | tr -s '\n' ' ')"
          done
